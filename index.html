<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>નખરા-લાલ - AI દસ્તાવેજ વિશ્લેષક</title>
    <!-- Tailwind CSS નો ઉપયોગ સ્ટાઇલિંગ માટે -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mammoth.js વર્ડ ફાઇલ્સ (.docx) વાંચવા માટે -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

        body { 
            font-family: 'Poppins', system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            height: 100vh; margin: 0; display: flex; flex-direction: column; 
            overflow: hidden; transition: background-color 0.8s ease;
        }

        /* --- લેન્ડિંગ પેજ ઓવરલે --- */
        #audio-overlay { 
            position: fixed; inset: 0; 
            background: #ffffff;
            z-index: 1000; display: flex; flex-direction: column; align-items: center; 
            padding: 2rem; overflow-y: auto; color: #ef4444;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
        }

        .profile-card {
            background: #ffffff; border-radius: 40px; padding: 3rem;
            max-width: 950px; width: 100%; border: 1px solid #fee2e2;
            box-shadow: 0 40px 100px rgba(239, 68, 68, 0.05);
            position: relative; animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .start-btn {
            background: #ffffff; color: #ef4444; padding: 1.2rem 3.5rem; border-radius: 100px;
            font-weight: 900; font-size: 1.5rem; box-shadow: 0 15px 35px rgba(239, 68, 68, 0.15);
            border: 2px solid #ef4444; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer; margin-top: 2rem; text-transform: uppercase;
        }
        .start-btn:hover { transform: scale(1.05); background: #ef4444; color: #ffffff; }

        /* --- એપ્લિકેશન UI એલિમેન્ટ્સ --- */
        .header { background: white; padding: 1rem 1.5rem; display: flex; align-items: center; border-bottom: 1px solid #e2e8f0; z-index: 10; }
        .avatar-container { width: 65px; height: 65px; margin-right: 1rem; }
        
        .parrot-svg { width: 100%; height: 100%; transform-origin: center; transition: all 0.5s ease; }
        .bird-feather { fill: #ef4444; transition: fill 0.5s ease; }
        
        /* રિએક્ટિવ એનિમેશન */
        .react-happy { animation: bounce 0.8s infinite; }
        .react-happy .bird-feather { fill: #fbbf24 !important; }
        .react-sad .bird-feather { fill: #475569 !important; }
        .react-angry { animation: shake 0.1s infinite; }
        .react-love { animation: heartbeat 1.2s infinite; }
        .react-love .bird-feather { fill: #f472b6 !important; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 100% { transform: translate(-1px, -1px); } }

        .main-container { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 300px; background: white; border-right: 1px solid #e2e8f0; padding: 1.5rem; display: flex; flex-direction: column; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #fdfdfd; }
        .chat-history { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth; }
        
        .msg-bubble { max-width: 85%; padding: 0.8rem 1.2rem; border-radius: 1.2rem; font-size: 15px; line-height: 1.7; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .msg-user { align-self: flex-end; background: #ef4444; color: white; border-bottom-right-radius: 4px; box-shadow: 0 10px 25px rgba(239, 68, 68, 0.2); }
        .msg-bot { align-self: flex-start; background: white; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }

        .drop-zone { border: 2px dashed #cbd5e1; border-radius: 20px; padding: 1.5rem; text-align: center; cursor: pointer; background: #fafafa; transition: 0.3s; margin-bottom: 1rem; }
        .mic-active { color: #ef4444 !important; animation: mic-pulse 1.5s infinite; }
        @keyframes mic-pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 20px; }
    </style>
</head>
<body>

    <!-- લેન્ડિંગ પેજ -->
    <div id="audio-overlay">
        <div class="profile-card">
            <div class="flex items-center gap-10 mb-14 pb-10 border-b border-rose-100">
                <div class="w-24 h-24 shrink-0">
                    <svg viewBox="0 0 115 100" class="parrot-svg">
                        <circle cx="45" cy="52" r="42" fill="#ef4444" />
                        <circle cx="64" cy="50" r="28" fill="white" /> 
                        <circle cx="70" cy="50" r="10" fill="#facc15" />
                        <circle cx="72" cy="50" r="4.5" fill="black" />
                        <path d="M 85 40 C 115 35, 125 75, 102 92 C 95 82, 88 78, 75 75 Z" fill="#0f172a" />
                    </svg>
                </div>
                <div><h1 class="text-7xl font-black text-red-600 leading-none">નખરા-લાલ</h1></div>
            </div>

            <div class="grid md:grid-cols-2 gap-8 text-left">
                <div class="identity-card bg-rose-50/50 p-4 rounded-xl">
                    <h2 class="font-bold text-red-600 uppercase text-xs">Identity</h2>
                    <p class="text-sm">ફ્લોરિડામાં જન્મેલી ગુજરાતી-અમેરિકન સ્માર્ટ મકાઉ.</p>
                </div>
                <div class="identity-card bg-rose-50/50 p-4 rounded-xl">
                    <h2 class="font-bold text-red-600 uppercase text-xs">Mission</h2>
                    <p class="text-sm">શિક્ષણમાં હાસ્ય અને સંસ્કૃતિમાં ઉત્સવ લાવવો.</p>
                </div>
            </div>

            <div class="mt-16 text-center">
                <p class="text-2xl italic font-bold text-rose-400 mb-10 tracking-tight">“ચલો, આજે તમારા મગજને થોડું ગરબા રમાડીએ!”</p>
                <button onclick="startSystem()" class="start-btn">અંદર પ્રવેશ કરો 🚀</button>
            </div>
        </div>
    </div>

    <!-- મુખ્ય હેડર -->
    <header class="header">
        <div class="avatar-container">
            <svg id="bird-svg" viewBox="0 -5 115 100" class="parrot-svg react-neutral">
                <circle cx="25" cy="70" r="20" class="bird-feather" />
                <circle cx="40" cy="55" r="40" class="bird-feather" />
                <path d="M 10 75 Q 5 85 15 95 Q 25 85 20 75 Z" fill="#ef4444" />
                <ellipse cx="55" cy="55" rx="22" ry="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
                <circle cx="58" cy="52" r="9" fill="#fde047" />
                <circle cx="59" cy="52" r="5" fill="#000000" />
                <path d="M 70 42 C 100 38, 105 60, 90 80 C 85 70, 78 65, 70 65 Z" fill="#0f172a" />
            </svg>
        </div>
        <div>
            <h1 class="text-slate-800 font-black text-xl leading-none">નખરા-લાલ</h1>
            <span id="bot-status" class="text-slate-500 text-[10px] font-bold uppercase mt-1 tracking-wider">Status: Ready</span>
        </div>
    </header>

    <div class="main-container">
        <!-- ફાઇલ મેનેજમેન્ટ માટે સાઇડબાર -->
        <aside class="sidebar hidden md:flex">
            <h2 class="text-slate-800 font-semibold mb-4 text-sm uppercase">લાઇબ્રેરી</h2>
            <div id="drop-zone" class="drop-zone" onclick="document.getElementById('file-input').click()">
                ફાઇલો અપલોડ કરો (TXT, MD, DOCX)<br><span class="text-slate-400 text-[10px]">સુરક્ષિત ઓફલાઇન વિશ્લેષણ</span>
                <input type="file" id="file-input" class="hidden" multiple accept=".txt,.md,.docx,.doc">
            </div>
            <div id="file-list" class="mt-4 flex-1 overflow-y-auto space-y-2 text-[11px] text-slate-600 font-medium"></div>
            <button onclick="clearKnowledgeBase()" class="mt-4 py-2 text-[10px] text-red-500 font-bold border border-red-100 rounded-xl hover:bg-red-50 transition-all uppercase">તમામ ફાઇલો કાઢી નાખો</button>
        </aside>

        <!-- ચેટ એરિયા -->
        <main class="chat-area">
            <div id="chat-history" class="chat-history"></div>
            <div class="p-4 bg-white border-t border-slate-200">
                <div class="max-w-4xl mx-auto flex gap-3 items-center">
                    <button id="mic-btn" onclick="toggleMic()" class="bg-slate-100 p-4 rounded-xl border transition-all hover:bg-slate-200">🎤</button>
                    <input type="text" id="user-input" placeholder="અહીં તમારો સંદેશ લખો..." class="flex-1 bg-slate-50 border rounded-xl px-4 outline-none focus:ring-2 focus:ring-red-400 py-3">
                    <button onclick="processMessage()" class="bg-red-500 px-8 py-3 rounded-xl font-bold shadow-md hover:bg-red-600 active:scale-95 text-white transition-all">Send</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const userInput = document.getElementById('user-input');
        const chatHistory = document.getElementById('chat-history');
        const birdSvg = document.getElementById('bird-svg');
        const botStatus = document.getElementById('bot-status');
        const micBtn = document.getElementById('mic-btn');
        const fileList = document.getElementById('file-list');

        let isBotSpeaking = false;
        let boredomTimer;
        let recognition;
        let isListening = false;
        let currentAudio = null;
        let knowledgeBase = []; 

        // --- ૧. સ્માર્ટ સર્ચ અને એનાલિસિસ લોજિક (SmartAnalyzer) ---
        const SmartAnalyzer = {
            async analyzeAndTranslate(query) {
                const qLower = query.toLowerCase().trim();
                const qWords = qLower.replace(/[?,!।.]/g, '').split(/\s+/).filter(w => w.length > 2);
                
                let bestSentence = "";
                let highestScore = 0;

                knowledgeBase.forEach(doc => {
                    const sentences = doc.content.split(/[.।?!\n\r]/).map(s => s.trim()).filter(s => s.length > 5);
                    sentences.forEach(s => {
                        let score = 0;
                        const sLower = s.toLowerCase();
                        qWords.forEach(word => { if (sLower.includes(word)) score += 10; });
                        if (score > highestScore) { highestScore = score; bestSentence = s; }
                    });
                });

                if (highestScore > 0) {
                    // જો દસ્તાવેજ અંગ્રેજીમાં હોય તો તેને ગુજરાતીમાં ટ્રાન્સલેટ કરીને સમજાવવું
                    const translatedText = await this.translateToGujarati(bestSentence);
                    return { found: true, original: bestSentence, gujarati: translatedText, score: highestScore };
                }
                return { found: false };
            },

            async translateToGujarati(text) {
                try {
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=gu&dt=t&q=${encodeURIComponent(text)}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    return data[0].map(item => item[0]).join('');
                } catch (e) { return text; }
            }
        };

        // --- ૨. સિસ્ટમ શરૂઆત ---
        function startSystem() {
            document.getElementById('audio-overlay').style.display = 'none';
            if(window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
            initSTT();
            resetBoredomTimer();
            setTimeout(() => { botRespond("નમસ્તે! હું નખરા-લાલ છું. પૂછો, દસ્તાવેજમાંથી તમારે શું જાણવું છે?", 'react-neutral'); }, 500);
        }

        // --- ૩. ફાઇલ પ્રોસેસિંગ ---
        document.getElementById('file-input').onchange = (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    let content = "";
                    if (file.name.endsWith('docx')) {
                        const res = await mammoth.extractRawText({ arrayBuffer: ev.target.result });
                        content = res.value;
                    } else content = ev.target.result;
                    knowledgeBase.push({ name: file.name, content: content });
                    renderFileList();
                    botRespond(`${file.name} વંચાઈ ગઈ છે!`, "react-neutral");
                };
                if (file.name.endsWith('docx')) reader.readAsArrayBuffer(file);
                else reader.readAsText(file);
            });
        };

        function renderFileList() {
            fileList.innerHTML = knowledgeBase.map((file, index) => `<div class='p-2 bg-slate-50 border rounded flex justify-between items-center text-[10px] font-bold'><span class="truncate pr-2">📄 ${file.name}</span><button onclick="knowledgeBase.splice(${index}, 1); renderFileList();" class="text-red-500">✕</button></div>`).join('');
        }

        function clearKnowledgeBase() { knowledgeBase = []; renderFileList(); botRespond("લાઇબ્રેરી સાફ કરી દેવામાં આવી છે.", "react-sad"); }

        // --- ૪. સ્પીચ રેકોગ્નિશન ---
        function initSTT() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SR) {
                recognition = new SR();
                recognition.lang = 'gu-IN';
                recognition.onstart = () => { isListening = true; micBtn.classList.add('mic-active'); botStatus.innerText = "Listening..."; };
                recognition.onend = () => { isListening = false; micBtn.classList.remove('mic-active'); botStatus.innerText = "Stable"; };
                recognition.onresult = (e) => { userInput.value = e.results[0][0].transcript; processMessage(); };
            }
        }

        function toggleMic() { if (recognition) isListening ? recognition.stop() : recognition.start(); }

        // --- ૫. મુખ્ય બ્રેઇન: મેસેજ પ્રોસેસિંગ ---
        async function processMessage() {
            const queryRaw = userInput.value.trim();
            if (!queryRaw) return;

            if (isBotSpeaking) {
                appendMessage(queryRaw, 'user');
                userInput.value = "";
                botRespond("શાંતિ રાખો! મને પહેલા પૂરું કરવા દો!", 'react-angry');
                return;
            }

            appendMessage(queryRaw, 'user');
            userInput.value = "";
            resetBoredomTimer();

            const query = queryRaw.toLowerCase();

            // દસ્તાવેજ વિશ્લેષણ અને ભાષાંતર
            if (knowledgeBase.length > 0) {
                botStatus.innerText = "Analyzing...";
                const result = await SmartAnalyzer.analyzeAndTranslate(queryRaw);
                botStatus.innerText = "Stable";

                if (result.found) {
                    const prefix = result.score > 15 ? "દસ્તાવેજ મુજબ સચોટ જવાબ:" : "મને સચોટ જવાબ નથી મળ્યો, પણ દસ્તાવેજમાં આ માહિતી સૌથી નજીક છે:";
                    return botRespond(`${prefix} <br><br><b>${result.gujarati}</b>`, 'react-neutral', "#dcfce7");
                }
            }

            // સામાન્ય જવાબો
            if (query.includes("નમસ્તે") || query.includes("hello")) return botRespond("નમસ્તે! કેમ છો તમે?", 'react-happy');
            if (query.includes("about") || query.includes("who are you")) return botRespond("હું નખરા-લાલ છું, તમારી ગુજરાતી મકાઉ મિત્ર!", 'react-neutral');
            if (query.includes("bye") || query.includes("આવજો")) return botRespond("આવજો! ફરી મળીએ.", 'react-neutral', "#faf5ff", () => location.reload());

            botRespond("હું તમારી વાત સાંભળું છું, પણ જો તમે ફાઇલ અપલોડ કરશો તો હું વધુ સારી રીતે વિશ્લેષણ કરી શકીશ.", 'react-neutral');
        }

        // --- ૬. અન્ય યુટિલિટીઝ ---
        function botRespond(text, mood, bg = "#f8fafc", onComplete = null) {
            birdSvg.className.baseVal = `parrot-svg ${mood}`;
            document.body.style.backgroundColor = bg;
            appendMessage(text, 'bot');
            speak(text, onComplete);
        }

        function speak(text, onComplete = null) {
            if (!text) return;
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            isBotSpeaking = true;
            const clean = text.replace(/<[^>]*>?/gm, '').replace(/[*#_`~]/g, '').trim();
            const cloudAudioUrl = `https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=gu&client=tw-ob&q=${encodeURIComponent(clean.substring(0, 200))}`;
            currentAudio = new Audio(cloudAudioUrl);
            currentAudio.onended = () => { isBotSpeaking = false; if (onComplete) onComplete(); };
            currentAudio.onerror = () => { fallbackNativeSpeak(clean, onComplete); };
            currentAudio.play().catch(e => { fallbackNativeSpeak(clean, onComplete); });
        }

        function fallbackNativeSpeak(text, onComplete = null) {
            if (!window.speechSynthesis) { isBotSpeaking = false; return; }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'gu-IN';
            utterance.onend = () => { isBotSpeaking = false; if (onComplete) onComplete(); };
            window.speechSynthesis.speak(utterance);
        }

        function resetBoredomTimer() {
            clearTimeout(boredomTimer);
            boredomTimer = setTimeout(() => { if (!isBotSpeaking && !isListening) botRespond("હું કંટાળી રહી છું, કંઈક તો પૂછો!", 'react-neutral', "#fbcfe8"); }, 30000); 
        }

        window.addEventListener('mousemove', resetBoredomTimer);
        window.addEventListener('keypress', resetBoredomTimer);

        function appendMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = sender === 'user' ? 'msg-bubble msg-user' : 'msg-bubble msg-bot';
            msg.innerHTML = `<strong>${sender === 'user' ? 'તમે' : 'નખરા-લાલ'}:</strong><br>${text}`;
            chatHistory.appendChild(msg);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') processMessage(); });
    </script>
</body>
</html>
