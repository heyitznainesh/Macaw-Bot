<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macaw Bot - Advanced Voice AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mammoth.js for reading DOCX files offline -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f1f5f9; 
            height: 100vh; margin: 0; display: flex; flex-direction: column; 
            overflow: hidden; transition: background-color 0.8s ease;
        }

        .header { background: white; padding: 1rem 1.5rem; display: flex; align-items: center; border-bottom: 1px solid #e2e8f0; z-index: 10; }
        .avatar-container { width: 65px; height: 65px; margin-right: 1rem; }
        
        /* Bird Animations & Colors */
        .parrot-svg { width: 100%; height: 100%; transform-origin: center; transition: all 0.5s ease; }
        .bird-feather { fill: #94a3b8; transition: fill 0.5s ease; }
        
        .react-neutral .bird-feather { fill: #94a3b8; }
        .react-happy { animation: bounce 0.8s infinite; }
        .react-happy .bird-feather { fill: #fbbf24 !important; }
        .react-sad .bird-feather { fill: #475569 !important; }
        .react-jealous { animation: pulse 1.2s infinite; }
        .react-jealous .bird-feather { fill: #8b5cf6 !important; }
        .react-angry { animation: shake 0.1s infinite; }
        .react-angry .bird-feather { fill: #ef4444 !important; }
        .react-love { animation: heartbeat 1.2s infinite; }
        .react-love .bird-feather { fill: #f472b6 !important; }
        .react-bye .bird-feather { fill: #a855f7 !important; }
        .react-bye { animation: wave 2s infinite; }
        .react-tech .bird-feather { fill: #3b82f6 !important; }
        .react-bored .bird-feather { fill: #f472b6 !important; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 100% { transform: translate(-1px, -1px); } }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes wave { 0% { transform: rotate(0deg); } 25% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } 75% { transform: rotate(-10deg); } 100% { transform: rotate(0deg); } }
        
        #emoticon-tear { display: none; }
        .react-sad #emoticon-tear { display: block; animation: tear-fall 2s infinite; }
        @keyframes tear-fall { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(20px); } }

        /* UI Layout */
        .main-container { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 300px; background: white; border-right: 1px solid #e2e8f0; padding: 1.5rem; display: flex; flex-direction: column; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #f8fafc; }
        .chat-history { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth; }
        
        .msg-bubble { max-width: 85%; padding: 0.8rem 1.2rem; border-radius: 1.2rem; font-size: 0.95rem; line-height: 1.6; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg-user { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 0.2rem; }
        .msg-bot { align-self: flex-start; background: white; border: 1px solid #e2e8f0; border-bottom-left-radius: 0.2rem; }

        .drop-zone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 1rem; text-align: center; cursor: pointer; background: #fafafa; font-size: 0.75rem; transition: all 0.3s ease; }
        .drop-zone:hover { background: #e0f2fe; border-color: #3b82f6; }
        
        /* Voice Mic Animation */
        .mic-active { background-color: #ef4444 !important; color: white !important; animation: mic-pulse 1.5s infinite; border-color: #ef4444 !important; }
        @keyframes mic-pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); } }

        #audio-overlay { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body onmousemove="resetBoredomTimer()" onkeypress="resetBoredomTimer()" onclick="resetBoredomTimer()">

    <!-- Audio Permission Overlay -->
    <div id="audio-overlay" onclick="startSystem()">
        <button class="bg-yellow-400 px-12 py-5 rounded-full font-bold text-xl shadow-xl hover:scale-105 active:scale-95 transition-all text-slate-800">
            🚀 Macaw શરૂ કરો
        </button>
        <p class="mt-6 text-slate-500 text-sm font-medium">અવાજ (Voice) અને માઈક્રોફોન સક્રિય કરવા ક્લિક કરો.</p>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="avatar-container">
            <svg id="bird-svg" viewBox="0 -5 115 100" class="parrot-svg react-neutral">
                <path d="M 10 75 Q 5 85 15 95 Q 25 85 20 75 Z" fill="#ef4444" />
                <circle cx="25" cy="70" r="20" class="bird-feather" />
                <circle cx="40" cy="55" r="40" class="bird-feather" />
                <ellipse cx="55" cy="55" rx="22" ry="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
                <circle cx="58" cy="52" r="9" fill="#fde047" />
                <circle cx="59" cy="52" r="5" fill="#000000" />
                <path d="M 70 42 C 100 38, 105 60, 90 80 C 85 70, 78 65, 70 65 Z" fill="#0f172a" />
                <path id="emoticon-tear" d="M 58 58 L 56 66 L 60 66 Z" fill="#3b82f6" />
            </svg>
        </div>
        <div>
            <h1 class="text-slate-800 font-bold text-lg leading-none">મકાઉ બોટ <span class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full ml-1 font-bold">Voice Enabled</span></h1>
            <span id="bot-status" class="text-slate-500 text-[10px] font-bold uppercase mt-1 tracking-wider">Status: Ready</span>
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar for File Management -->
        <aside class="sidebar hidden md:flex">
            <h2 class="text-slate-800 font-semibold mb-4 text-sm">Knowledge Base</h2>
            <div id="drop-zone" class="drop-zone" onclick="document.getElementById('file-input').click()">
                ફાઇલો અપલોડ કરો (TXT, MD, DOCX)<br><span class="text-slate-400 text-[10px]">100% Offline Analysis</span>
                <input type="file" id="file-input" class="hidden" multiple accept=".txt,.md,.docx,.doc">
            </div>
            <div id="file-list" class="mt-4 flex-1 overflow-y-auto space-y-2 text-[11px] text-slate-600 font-medium"></div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area">
            <div id="chat-history" class="chat-history"></div>
            <div class="p-4 bg-white border-t border-slate-200">
                <div class="max-w-4xl mx-auto flex gap-3 items-center relative">
                    <!-- MIC BUTTON -->
                    <button id="mic-btn" onclick="toggleMic()" class="bg-slate-100 p-4 rounded-xl border-2 border-slate-200 transition-all hover:bg-slate-200 text-xl" title="અવાજથી વાત કરવા ક્લિક કરો">
                        🎤
                    </button>
                    
                    <input type="text" id="user-input" placeholder="અહીં ટાઇપ કરો અથવા માઇક્રોફોનનો ઉપયોગ કરો..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 outline-none focus:ring-2 focus:ring-blue-400 py-3 transition-all placeholder-slate-400">
                    
                    <button onclick="processMessage()" class="bg-[#facc15] px-8 py-3 rounded-xl font-bold shadow-md hover:bg-[#eab308] active:scale-95 text-slate-800 transition-all">
                        Send
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Core Logic Script -->
    <script>
        // DOM Elements
        const userInput = document.getElementById('user-input');
        const chatHistory = document.getElementById('chat-history');
        const birdSvg = document.getElementById('bird-svg');
        const botStatus = document.getElementById('bot-status');
        const micBtn = document.getElementById('mic-btn');
        const fileList = document.getElementById('file-list');

        // State Variables
        let isBotSpeaking = false;
        let boredomTimer;
        let recognition;
        let isListening = false;
        let currentAudio = null;
        let localKnowledgeBase = []; 

        // Bot Responses Database
        const emotionsDB = {
            happy: ["આજે મારું મન પતંગિયાની જેમ ઉડી રહ્યું છે!", "વાહ! આજનો દિવસ તો સોના જેવો છે."],
            sad: ["મારું હૃદય આજે ભીનું છે, મને સારું નથી લાગતું.", "ક્યારેક યાદો બહુ પજવે છે."],
            love: ["પ્રેમ તો હવામાં છે, મારું દિલ ગુલાબી થઈ ગયું છે!", "તમારી મિત્રતા મારા માટે સૌથી કિંમતી છે."],
            tech: ["શું તમે જાણો છો? ભવિષ્યમાં રોબોટ્સ આપણી બધી જ જરૂરિયાતો સમજી લેશે!"],
            joke: ["શિક્ષક: 'હું' અને 'તમે' કયો કાળ કહેવાય? વિદ્યાર્થી: સાહેબ, 'હું' એટલે ભૂતકાળ!"],
            angry: ["ચૂપ રહો! પહેલા મને બોલી લેવા દો!", "ખબરદાર જો વચ્ચે બોલ્યા તો!"],
            bored: ["હું કંટાળી રહી છું, કંઈક તો બોલો!", "શું તમે સૂઈ ગયા છો? હું ક્યારની રાહ જોઉં છું."],
            jealous: ["તો પછી ત્યાં જ જાઓ અને તેમને પૂછો, તમે હજી પણ મારો ઉપયોગ કેમ કરો છો?"],
            bye: ["આવજો, આપણે જલ્દી મળીશું!", "આવજો, તમારો દિવસ શુભ રહે!"],
            fear: [
                "એક અંધારી રાતે... લાઈટ ગઈ, અને અચાનક કોઈએ મારા ખભા પર હાથ મૂક્યો. પાછળ ફરીને જોયું તો કોઈ નહોતું!",
                "જૂની હવેલીમાંથી રોજ રાત્રે અવાજ આવતો... કાલે રાત્રે મેં જોયું તો... અવાજ મારી પાછળથી જ આવતો હતો!",
                "રસ્તા પર એક છોકરી લિફ્ટ માંગતી હતી. મેં ગાડી ઊભી રાખી, પાછળ જોયું તો સીટ ખાલી હતી... અને કાચ પર લોહીથી લખ્યું હતું 'આભાર'."
            ],
            interest: [
                "શું તમે જાણો છો? મકાઉ પક્ષીઓ મનુષ્યની જેમ જ અવાજની નકલ કરી શકે છે અને તેઓ ૮૦ વર્ષ સુધી જીવી શકે છે!",
                "એક રસપ્રદ વાત: ડોલ્ફિન માછલીઓ એકબીજાને નામથી બોલાવે છે. તેમની પાસે દરેક માટે અલગ અવાજ (સીટી) હોય છે.",
                "તમને જાણીને નવાઈ લાગશે કે શાહમૃગ (Ostrich) ની આંખ તેના મગજ કરતા પણ મોટી હોય છે!",
                "શું તમને ખબર છે? ઓક્ટોપસ પાસે ૩ હૃદય અને ૯ મગજ હોય છે, અને તેમના લોહીનો રંગ ભૂરો (Blue) હોય છે!"
            ]
        };

        // Offline Dictionary for Translation
        const offlineDictionary = {
            "hello": "નમસ્તે", "world": "દુનિયા", "document": "દસ્તાવેજ", "water": "પાણી", 
            "cycle": "ચક્ર", "nature": "પ્રકૃતિ", "computer": "કમ્પ્યુટર", "science": "વિજ્ઞાન",
            "data": "ડેટા", "information": "માહિતી", "system": "સિસ્ટમ", "user": "વપરાશકર્તા",
            "analysis": "વિશ્લેષણ", "translation": "ભાષાંતર", "offline": "ઓફલાઇન", "smart": "સ્માર્ટ",
            "artificial": "કૃત્રિમ", "intelligence": "બુદ્ધિ", "bird": "પક્ષી", "parrot": "પોપટ",
            "good": "સારું", "morning": "સવાર", "night": "રાત", "time": "સમય", "day": "દિવસ",
            "name": "નામ", "work": "કામ", "help": "મદદ", "thank": "આભાર", "you": "તમે",
            "is": "છે", "this": "આ", "what": "શું", "where": "ક્યાં", "how": "કેવી રીતે",
            "and": "અને", "or": "અથવા", "but": "પરંતુ", "if": "જો"
        };

        // --- Core Functions ---
        function startSystem() {
            document.getElementById('audio-overlay').style.display = 'none';
            if(window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
            initSTT();
            resetBoredomTimer();
            setTimeout(() => { 
                botRespond("નમસ્તે! હું Macaw Bot છું.", 'react-neutral'); 
            }, 500);
        }

        // Global function to reset the boredom timer safely
        window.resetBoredomTimer = function() {
            if (boredomTimer) clearTimeout(boredomTimer);
            boredomTimer = setTimeout(() => {
                if (!isBotSpeaking && !isListening) {
                    const msg = emotionsDB.bored[Math.floor(Math.random() * emotionsDB.bored.length)];
                    botRespond(msg, 'react-bored', "#fbcfe8");
                }
            }, 15000); 
        };

        // --- File Upload & Knowledge Base ---
        document.getElementById('file-input').onchange = (e) => {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            
            botStatus.innerText = "Processing Files...";
            let loadedCount = 0;

            function checkDone() {
                loadedCount++;
                if (loadedCount === files.length) {
                    renderFileList();
                    botStatus.innerText = "Stable";
                    botRespond("ફાઈલ લોડ થઈ ગઈ છે!", 'react-tech', "#dbeafe");
                }
            }

            files.forEach(file => {
                const extension = file.name.split('.').pop().toLowerCase();
                const reader = new FileReader();

                reader.onload = (ev) => {
                    if (extension === "docx" || extension === "doc") {
                        mammoth.extractRawText({ arrayBuffer: ev.target.result })
                            .then((result) => {
                                localKnowledgeBase.push({ name: file.name, content: result.value });
                                checkDone();
                            }).catch(err => {
                                console.error(err);
                                checkDone();
                            });
                    } else {
                        localKnowledgeBase.push({ name: file.name, content: ev.target.result });
                        checkDone();
                    }
                };

                if (extension === "docx" || extension === "doc") {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file);
                }
            });

            e.target.value = "";
        };

        function renderFileList() {
            fileList.innerHTML = localKnowledgeBase.map((file, index) => `
                <div class='p-2 bg-slate-50 border border-slate-200 rounded flex justify-between items-center mb-1'>
                    <span class="truncate pr-2 text-[11px]" title="${file.name}">📄 ${file.name}</span>
                    <div class="flex gap-1 shrink-0">
                        <button onclick="analyzeDoc(${index})" class="text-purple-500 hover:bg-purple-100 px-1.5 py-0.5 rounded transition-colors" title="દસ્તાવેજ એનાલિસિસ (Doc Analyzer)">📊</button>
                        <button onclick="translateFileOffline(${index})" class="text-blue-500 hover:bg-blue-100 px-1.5 py-0.5 rounded transition-colors" title="100% ઓફલાઇન ભાષાંતર">📴</button>
                        <button onclick="removeFile(${index})" class="text-red-500 hover:bg-red-100 px-1.5 py-0.5 rounded transition-colors" title="દૂર કરો">✕</button>
                    </div>
                </div>
            `).join('');
        }

        window.removeFile = function(index) {
            const removedName = localKnowledgeBase[index].name;
            localKnowledgeBase.splice(index, 1);
            renderFileList();
            botRespond(`"${removedName}" કાઢી નાખવામાં આવી છે.`, 'react-sad');
        };

        // --- Offline Analytics ---
        window.analyzeDoc = function(index) {
            const file = localKnowledgeBase[index];
            const text = file.content;
            botStatus.innerText = "Analyzing...";
            
            const charCount = text.length;
            const wordCount = text.split(/\s+/).filter(w => w.length > 0).length;
            const sentences = text.split(/[.!?।\n]/).filter(s => s.trim().length > 5);
            const sentenceCount = sentences.length;
            
            const stopWords = ['the','is','in','and','to','of','a','for','on','with','as','by','that','it','this','from','are','or','be','an'];
            const words = text.toLowerCase().match(/\b[a-z]{4,}\b/g) || [];
            const freq = {};
            words.forEach(w => {
                if(!stopWords.includes(w)) freq[w] = (freq[w] || 0) + 1;
            });
            const topKeywords = Object.entries(freq).sort((a,b) => b[1] - a[1]).slice(0, 5).map(e => e[0]).join(', ') || "No keywords";

            const summary = sentences.slice(0, 2).join('. ') + (sentences.length > 2 ? '...' : '');

            const report = `
                <div class="text-left bg-white p-3 rounded-xl border border-slate-200 mt-2 shadow-sm text-sm">
                    <h3 class="font-bold text-slate-800 border-b pb-1 mb-2">📊 Doc Analyzer Report</h3>
                    <p><b>ફાઈલનું નામ:</b> ${file.name}</p>
                    <p><b>કુલ શબ્દો:</b> ${wordCount}</p>
                    <p><b>કુલ વાક્યો:</b> ${sentenceCount}</p>
                    <p><b>મુખ્ય કીવર્ડ્સ:</b> <span class="text-blue-600">${topKeywords}</span></p>
                    <div class="mt-2 pt-2 border-t">
                        <b>📝 ટૂંકો સારાંશ (Summary):</b><br>
                        <i class="text-slate-600">${summary}</i>
                    </div>
                </div>
            `;
            
            botStatus.innerText = "Stable";
            botRespond(`મેં <b>${file.name}</b> નું ઓફલાઇન એનાલિસિસ પૂર્ણ કર્યું છે: ${report}`, 'react-tech', '#f8fafc');
        };

        // --- Offline Translation ---
        function offlineTranslateText(text) {
            let translated = text;
            const wordsRegex = /\b[a-zA-Z]+\b/g;
            translated = translated.replace(wordsRegex, (match) => {
                const lowerMatch = match.toLowerCase();
                if (offlineDictionary[lowerMatch]) {
                    return offlineDictionary[lowerMatch];
                }
                return match; 
            });
            return translated;
        }

        window.translateFileOffline = function(index) {
            const file = localKnowledgeBase[index];
            botRespond(`હું અત્યારે <b>${file.name}</b> નું 100% ઓફલાઇન ભાષાંતર કરી રહ્યો છું... (ઇન્ટરનેટ વિના)`, 'react-tech', '#e0f2fe');
            botStatus.innerText = "Translating Offline...";
            
            setTimeout(() => {
                const translatedText = offlineTranslateText(file.content);
                botStatus.innerText = "Stable";
                const formattedText = translatedText.replace(/\n/g, '<br>');
                
                const responseHtml = `
                    <b>📴 ઓફલાઇન ભાષાંતર પરિણામ:</b><br>
                    <span class="text-[10px] text-slate-500 mb-2 block">(આ ભાષાંતર 100% ઓફલાઇન છે, ઇન્ટરનેટ વિના. તેમાં લોકલ ડિક્શનરીનો ઉપયોગ થયો છે.)</span>
                    <div class="text-xs bg-white p-3 rounded-xl border mt-2 max-h-60 overflow-y-auto leading-relaxed shadow-inner">
                        ${formattedText}
                    </div>`;
                    
                botRespond(responseHtml, 'react-happy', '#dcfce7');
            }, 600); 
        };

        // --- Speech-to-Text (STT) Setup ---
        function initSTT() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SR) {
                recognition = new SR();
                recognition.lang = 'gu-IN';
                recognition.continuous = false; 
                
                recognition.onstart = () => { 
                    isListening = true; 
                    micBtn.classList.add('mic-active'); 
                    botStatus.innerText = "Listening..."; 
                    userInput.placeholder = "સાંભળી રહ્યો છું, કૃપા કરીને બોલો...";
                };
                
                recognition.onend = () => { 
                    isListening = false; 
                    micBtn.classList.remove('mic-active'); 
                    botStatus.innerText = "Stable"; 
                    userInput.placeholder = "અહીં ટાઇપ કરો અથવા માઇક્રોફોનનો ઉપયોગ કરો...";
                };
                
                recognition.onresult = (e) => { 
                    const text = e.results[e.results.length - 1][0].transcript;
                    userInput.value = text; 
                    setTimeout(() => processMessage(), 500);
                };
                
                recognition.onerror = (e) => {
                    botStatus.innerText = "Mic Error";
                    micBtn.classList.remove('mic-active');
                    userInput.placeholder = "અહીં ટાઇપ કરો અથવા માઇક્રોફોનનો ઉપયોગ કરો...";
                };
            } else {
                botStatus.innerText = "Voice Not Supported";
            }
        }

        window.toggleMic = function() { 
            if (!recognition) return alert("તમારું બ્રાઉઝર વોઈસ કમાન્ડ સપોર્ટ કરતું નથી.");
            if (isBotSpeaking) {
                if (currentAudio) currentAudio.pause();
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                isBotSpeaking = false;
            }
            isListening ? recognition.stop() : recognition.start(); 
        };

        // --- CHAT LOGIC ---
        window.processMessage = function() {
            const queryRaw = userInput.value.trim();
            if (!queryRaw) return;

            if (isBotSpeaking) {
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                isBotSpeaking = false;

                appendMessage(queryRaw, 'user');
                userInput.value = "";
                botRespond("અરે ઊભા રહો! હું હજી બોલી રહી છું, આટલી ઉતાવળ ના કરો. શાંતિ રાખો!", 'react-angry', "#fee2e2");
                return;
            }

            appendMessage(queryRaw, 'user');
            userInput.value = "";
            resetBoredomTimer();

            const query = queryRaw.toLowerCase();
            
            if (query.includes("ભાષાંતર") || query.includes("અનુવાદ")) {
                if(localKnowledgeBase.length > 0) return translateFileOffline(0);
                return botRespond("ભાષાંતર કરવા માટે પહેલા ડાબી બાજુએ કોઈ ફાઈલ અપલોડ કરો.", 'react-neutral');
            }

            if (query.includes("એનાલિસિસ") || query.includes("analyze") || query.includes("વિશ્લેષણ")) {
                if(localKnowledgeBase.length > 0) return analyzeDoc(0);
                return botRespond("એનાલિસિસ કરવા માટે પહેલા ડાબી બાજુએ કોઈ ફાઈલ અપલોડ કરો.", 'react-neutral');
            }

            if (query === "by" || query.includes("bye") || query.includes("આવજો") || query.includes("બાય")) {
                return botRespond(emotionsDB.bye[Math.floor(Math.random() * emotionsDB.bye.length)], 'react-bye', "#faf5ff");
            }

            const rivals = ["alexa", "siri", "gpt", "chat", "gemini", "bot"];
            if (rivals.some(ai => query.includes(ai)) && !query.includes("macaw")) {
                return botRespond(emotionsDB.jealous[0], 'react-jealous', "#ede9fe");
            }

            if (query.includes("ડર") || query.includes("fear") || query.includes("horror") || query.includes("ભૂત") || query.includes("creepy") || query.includes("sinister") || query.includes("uncanny") || query.includes("spooky")) {
                const story = emotionsDB.fear[Math.floor(Math.random() * emotionsDB.fear.length)];
                return botRespond(`<b>ડરામણી વાર્તા 👻:</b><br>${story}`, 'react-sad', "#e2e8f0");
            }

            if (query.includes("રસપ્રદ") || query.includes("interest") || query.includes("fact") || query.includes("ફેક્ટ") || query.includes("જાણવા જેવું")) {
                const fact = emotionsDB.interest[Math.floor(Math.random() * emotionsDB.interest.length)];
                return botRespond(`<b>રસપ્રદ હકીકત 💡:</b><br>${fact}`, 'react-happy', "#fef9c3");
            }

            if (query.includes("ખુશ") || query.includes("happy")) return botRespond(emotionsDB.happy[0], 'react-happy', "#fef9c3");
            if (query.includes("ઉદાસ") || query.includes("sad")) return botRespond(emotionsDB.sad[0], 'react-sad', "#f1f5f9");
            if (query.includes("પ્રેમ") || query.includes("love")) return botRespond(emotionsDB.love[0], 'react-love', "#fce7f3");
            if (query.includes("જોક") || query.includes("joke")) return botRespond(emotionsDB.joke[0], 'react-happy', "#ffedd5");

            // RAG Query
            botStatus.innerText = "Analyzing Docs...";
            let found = null;
            let maxMatches = 0;
            const searchWords = query.split(/\s+/).filter(w => w.length > 2); 

            localKnowledgeBase.forEach(doc => {
                const sentences = doc.content.replace(/\n/g, '. ').replace(/।/g, '. ').split(/[.?!]/);
                sentences.forEach(sentence => {
                    let matches = 0;
                    searchWords.forEach(word => {
                        if (sentence.toLowerCase().includes(word)) matches++;
                    });
                    if (matches > maxMatches && sentence.length > 10) {
                        maxMatches = matches;
                        found = sentence.trim();
                    }
                });
            });
            
            botStatus.innerText = "Stable";

            if (found && maxMatches > 0) {
                botRespond(`<b>દસ્તાવેજ મુજબ:</b> ${found}।`, 'react-tech', "#dbeafe");
            } else if (localKnowledgeBase.length > 0) {
                 botRespond("માફ કરજો, આપેલી ફાઇલોમાંથી મને આને લગતી કોઈ માહિતી મળી નથી.", 'react-sad', '#f1f5f9');
            } else {
                 botRespond("હું તમારી વાત સાંભળી રહ્યો છું. (વધુ માહિતી માટે ડાબી બાજુએ ફાઈલ અપલોડ કરો)", 'react-neutral');
            }
        };

        // --- Output & TTS ---
        function botRespond(text, mood, bg = "#f1f5f9") {
            birdSvg.setAttribute('class', 'parrot-svg ' + mood);
            document.body.style.backgroundColor = bg;
            appendMessage(text, 'bot');
            speak(text);
        }

        function speak(text) {
            const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/[*#_`~]/g, '').trim(); 
            if (!cleanText) return;

            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            isBotSpeaking = true;
            botStatus.innerText = "Speaking...";

            const cloudAudioUrl = `https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=gu&client=tw-ob&q=${encodeURIComponent(cleanText.substring(0, 200))}`;
            currentAudio = new Audio(cloudAudioUrl);

            currentAudio.onended = () => { isBotSpeaking = false; botStatus.innerText = "Stable"; };
            currentAudio.onerror = () => { fallbackNativeSpeak(cleanText); };
            currentAudio.play().catch(e => { fallbackNativeSpeak(cleanText); });
        }

        function fallbackNativeSpeak(text) {
            if (!window.speechSynthesis) { isBotSpeaking = false; return; }
            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'gu-IN';
                utterance.rate = 0.85; 
                
                const voices = window.speechSynthesis.getVoices();
                const guVoice = voices.find(v => v.lang.includes('gu')) || voices.find(v => v.name.toLowerCase().includes('gujarati'));
                if (guVoice) utterance.voice = guVoice;

                utterance.onend = () => { isBotSpeaking = false; botStatus.innerText = "Stable"; };
                utterance.onerror = () => { isBotSpeaking = false; botStatus.innerText = "Stable"; };
                
                window.speechSynthesis.speak(utterance);
            }, 100);
        }

        function appendMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = sender === 'user' ? 'msg-bubble msg-user' : 'msg-bubble msg-bot';
            msg.innerHTML = `<strong>${sender === 'user' ? 'તમે' : 'Macaw'}:</strong><br>${text}`;
            if (sender === 'bot') {
                msg.onclick = () => speak(text);
                msg.title = "ફરીથી સાંભળવા ક્લિક કરો";
            }
            chatHistory.appendChild(msg);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') processMessage(); });
    </script>
</body>
</html>
