<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macaw Bot - Professional Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="audio-overlay" onclick="unblockAudio()">
        <div class="pulse-btn">🔊 અવાજ ચાલુ કરવા અહીં ક્લિક કરો</div>
        <p class="mt-4 text-slate-500 text-sm">બોટનો અવાજ સાંભળવા માટે ક્લિક કરવું જરૂરી છે.</p>
    </div>

    <header class="header">
        <div class="avatar-container">
            <svg id="bird-svg" viewBox="0 -5 115 100" class="parrot-svg react-neutral">
                <path d="M 10 75 Q 5 85 15 95 Q 25 85 20 75 Z" fill="#ef4444" />
                <circle cx="25" cy="70" r="20" class="bird-feather" />
                <circle cx="40" cy="55" r="40" class="bird-feather" />
                <path d="M 45 18 Q 30 -5 20 5 Q 35 15 30 25 Z" class="bird-feather" opacity="0.9" />
                <ellipse cx="55" cy="55" rx="22" ry="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
                <circle cx="58" cy="52" r="9" fill="#fde047" />
                <circle cx="59" cy="52" r="5" fill="#000000" />
                <path d="M 70 42 C 100 38, 105 60, 90 80 C 85 70, 78 65, 70 65 Z" fill="#0f172a" />
            </svg>
        </div>
        <div class="flex flex-col">
            <h1 class="text-slate-800 font-bold text-lg uppercase leading-none">Macaw Bot</h1>
            <span id="bot-status" class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mt-1 transition-colors">Status: Stable</span>
        </div>
    </header>

    <div class="main-container">
        <aside class="rag-sidebar">
            <h2 class="text-slate-800 font-semibold mb-4 text-sm">Knowledge Base</h2>
            <div id="drop-zone" onclick="document.getElementById('file-input').click()" class="drop-zone transition-colors duration-200">
                <p class="text-slate-500 text-xs">Click or Drag & Drop Any files here</p>
                <input type="file" id="file-input" class="hidden" multiple>
            </div>
            <div id="file-list" class="mt-4 flex flex-col gap-2 overflow-y-auto"></div>
        </aside>

        <main class="chat-area">
            <div id="chat-history" class="chat-history"></div>
            <div class="input-area">
                <div class="max-w-4xl mx-auto flex gap-3">
                    <button id="mic-btn" onclick="toggleRecording()" class="bg-slate-200 p-3 rounded-xl text-slate-700 hover:bg-slate-300 transition-colors border border-slate-300" title="Voice Search (Gujarati)">
                        🎤
                    </button>
                    <input type="text" id="user-input" placeholder="તમારો સંદેશ લખો..." class="input-field">
                    <button id="send-btn" onclick="processMessage()" class="bg-[#facc15] px-6 py-2 rounded-xl font-bold text-slate-900 hover:bg-[#eab308] transition-colors">
                        Send
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
